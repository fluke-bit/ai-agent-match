name: Update agents index

on:
  # schedule:
    # - cron: "0 9 * * *"   # every day at 9:00 UTC (about 5am Eastern)
  workflow_dispatch:       # lets you also run it by hand

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Build the index
        run: python build_index.py

      - name: Save the new file if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agents-index.json
          git diff --staged --quiet || git commit -m "Update agents index"
          git push
